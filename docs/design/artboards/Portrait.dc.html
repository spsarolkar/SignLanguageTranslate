<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Pipeline — Portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Instrument Sans", -apple-system, system-ui, sans-serif; background: #0B0D0F; }
a { color: #5EC8A8; } a:hover { color: #8EDCC3; }
</style>
</helmet>
<div style="width: 1024px; height: 1366px; box-sizing: border-box; padding: 24px 32px 28px 32px; display: flex; flex-direction: column; gap: 16px; background: #0B0D0F; color: #EEF1F3; font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; flex-shrink: 0;">
    <button type="button" aria-label="Show datasets sidebar" style="width: 44px; height: 44px; border-radius: 11px; background: #15181B; border: 1px solid #262B31; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D1D8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(94,200,168,0.12); border: 1px solid rgba(94,200,168,0.35);">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #5EC8A8; display: inline-block;"></span>
      <span style="font-size: 13px; font-weight: 600; color: #5EC8A8;">Processing</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;">
    <span style="font-size: 12px; color: #8A949D;">INCLUDE / Animals</span>
    <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em;">Data Pipeline</h1>
  </div>

  <div style="box-sizing: border-box; padding: 18px 20px; border-radius: 16px; background: #15181B; border: 1px solid #262B31; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 16px; font-weight: 600;">INCLUDE</span>
      <div style="display: flex; gap: 9px;">
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 11px; background: #232930; border: 1px solid #333B43; color: #E4E9ED; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Pause All</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 11px; background: #5EC8A8; border: none; color: #0B0D0F; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Download All</button>
      </div>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #232930; overflow: hidden; display: flex;">
      <div style="width: 43%; height: 8px; background: #5EC8A8;"></div>
      <div style="width: 9%; height: 8px; background: rgba(94,200,168,0.32);"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">
      <span>19 complete · 3 active · 22 queued</span>
      <span>184.2 / 428.6 GB</span>
    </div>
  </div>

  <div style="display: flex; gap: 7px; flex-wrap: wrap; flex-shrink: 0;">
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(94,200,168,0.16); border: 1px solid rgba(94,200,168,0.45); color: #5EC8A8; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Animals</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Adjectives</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Clothes</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Colours</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Days &amp; Time</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Greetings</button>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: #15181B; border: 1px solid #262B31; color: #98A2AC; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Home</button>
  </div>

  <div style="position: relative; width: 960px; height: 540px; border-radius: 16px; background: #101418; border: 1px solid #262B31; overflow: hidden; flex-shrink: 0;">
    <svg width="960" height="540" viewBox="0 0 960 540" aria-hidden="true" style="display: block;">
      <rect x="0" y="0" width="960" height="540" fill="#13181D"></rect>
      <ellipse cx="480" cy="410" rx="252" ry="200" fill="#181E24"></ellipse>
      <circle cx="480" cy="182" r="72" fill="#1C232A"></circle>
      <g stroke="#5EC8A8" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="480" y1="254" x2="480" y2="390"></line>
        <line x1="480" y1="282" x2="368" y2="328"></line>
        <line x1="368" y1="328" x2="312" y2="420"></line>
        <line x1="480" y1="282" x2="592" y2="328"></line>
        <line x1="592" y1="328" x2="640" y2="412"></line>
        <line x1="312" y1="420" x2="288" y2="460"></line>
        <line x1="312" y1="420" x2="318" y2="470"></line>
        <line x1="312" y1="420" x2="344" y2="468"></line>
        <line x1="640" y1="412" x2="616" y2="458"></line>
        <line x1="640" y1="412" x2="646" y2="470"></line>
        <line x1="640" y1="412" x2="674" y2="460"></line>
      </g>
      <g fill="#8EDCC3">
        <circle cx="480" cy="182" r="6"></circle>
        <circle cx="480" cy="282" r="6"></circle>
        <circle cx="368" cy="328" r="6"></circle>
        <circle cx="592" cy="328" r="6"></circle>
        <circle cx="312" cy="420" r="7"></circle>
        <circle cx="640" cy="412" r="7"></circle>
      </g>
      <g fill="#E0A458">
        <circle cx="288" cy="460" r="4"></circle>
        <circle cx="318" cy="470" r="4"></circle>
        <circle cx="344" cy="468" r="4"></circle>
        <circle cx="616" cy="458" r="4"></circle>
        <circle cx="646" cy="470" r="4"></circle>
        <circle cx="674" cy="460" r="4"></circle>
      </g>
    </svg>

    <div style="position: absolute; top: 16px; right: 16px; width: 206px; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: rgba(13,17,21,0.84); border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #9BA5AE;">KEYPOINT CONFIDENCE</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; color: #5EC8A8;">98</span>
        <span style="font-size: 15px; color: #9BA5AE;">%</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #9BA5AE;"><span>Hands</span><span style="font-family: 'IBM Plex Mono', monospace; color: #D3DAE0;">42 / 42</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #9BA5AE;"><span>Body</span><span style="font-family: 'IBM Plex Mono', monospace; color: #D3DAE0;">17 / 19</span></div>
    </div>

    <div style="position: absolute; left: 16px; top: 16px; padding: 8px 13px; border-radius: 10px; background: rgba(13,17,21,0.84); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600; color: #E9EFF3;">Dog · dog_001</div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; box-sizing: border-box; padding: 11px 14px; border-radius: 14px; background: rgba(13,17,21,0.84); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14px;">
      <button type="button" aria-label="Play clip" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 11px; background: #5EC8A8; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#0B0D0F" aria-hidden="true"><polygon points="6 4 20 12 6 20"></polygon></svg>
      </button>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #D3DAE0;">0:01</span>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16); overflow: hidden;">
        <div style="width: 38%; height: 4px; background: #E9EFF3;"></div>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9BA5AE;">0:02</span>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 11px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); color: #D3DAE0; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;">Skeleton</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #8A949D;">WORDS IN ANIMALS</span>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
      <button type="button" style="box-sizing: border-box; min-height: 52px; padding: 0 14px; border-radius: 11px; background: #1D2126; border: 1px solid #33414A; display: flex; align-items: center; justify-content: space-between; font-family: inherit; cursor: pointer;"><span style="font-size: 14px; font-weight: 600; color: #EEF1F3;">Dog</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">26</span></button>
      <button type="button" style="box-sizing: border-box; min-height: 52px; padding: 0 14px; border-radius: 11px; background: #15181B; border: 1px solid #262B31; display: flex; align-items: center; justify-content: space-between; font-family: inherit; cursor: pointer;"><span style="font-size: 14px; font-weight: 500; color: #98A2AC;">Cat</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">24</span></button>
      <button type="button" style="box-sizing: border-box; min-height: 52px; padding: 0 14px; border-radius: 11px; background: #15181B; border: 1px solid #262B31; display: flex; align-items: center; justify-content: space-between; font-family: inherit; cursor: pointer;"><span style="font-size: 14px; font-weight: 500; color: #98A2AC;">Bird</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">22</span></button>
      <button type="button" style="box-sizing: border-box; min-height: 52px; padding: 0 14px; border-radius: 11px; background: #15181B; border: 1px solid #262B31; display: flex; align-items: center; justify-content: space-between; font-family: inherit; cursor: pointer;"><span style="font-size: 14px; font-weight: 500; color: #98A2AC;">Cow</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">19</span></button>
      <button type="button" style="box-sizing: border-box; min-height: 52px; padding: 0 14px; border-radius: 11px; background: #15181B; border: 1px solid #262B31; display: flex; align-items: center; justify-content: space-between; font-family: inherit; cursor: pointer;"><span style="font-size: 14px; font-weight: 500; color: #98A2AC;">Fish</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A949D;">23</span></button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-height: 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #8A949D;">SAMPLES — DOG</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6C7A85;">26 clips</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{samples}}" as="s" hint-placeholder-count="8">
        <div style="box-sizing: border-box; height: 84px; border-radius: 11px; background: #13181D; border: 1px solid {{s.border}}; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #8A949D;">{{s.id}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{s.fg}};">{{s.conf}}</span>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":1366}}'>
class Component extends DCLogic {
  renderVals() {
    const confs = [0.98, 0.97, 0.96, 0.94, 0.93, 0.91, 0.88, 0.74];
    return {
      samples: confs.map(function (c, i) {
        const low = c < 0.8;
        return {
          id: 'dog_' + String(i + 1).padStart(3, '0'),
          conf: c.toFixed(2),
          fg: low ? '#E5695B' : '#5EC8A8',
          border: low ? 'rgba(229,105,91,0.4)' : '#262B31'
        };
      })
    };
  }
}
</script>
</body>
</html>
